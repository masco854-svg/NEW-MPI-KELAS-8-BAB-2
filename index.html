    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap');
        
        * {
            font-family: 'Poppins', sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #dc2626;
            border-radius: 4px;
        }

        /* Snake & Ladder Grid */
        .snakes-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        /* Keyframe Animations */
        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 2s infinite ease-in-out;
        }

        @keyframes bounce-short {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .animate-bounce-short {
            animation: bounce-short 1s infinite;
        }

        @keyframes pop-in {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop-in {
            animation: pop-in 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Card Flip Styling */
        .perspective-1000 {
            perspective: 1000px;
        }
        .preserve-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
    </style>
</head>

    <!-- AUDIO SYNTHESIZER (WEB AUDIO API) -->
    <script>
        const AudioEngine = {
            ctx: null,
            enabled: true,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playClick() {
                if (!this.enabled) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            },
            playCorrect() {
                if (!this.enabled) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, this.ctx.currentTime + 0.2); // G5
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            },
            playWrong() {
                if (!this.enabled) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime); // A3
                osc.frequency.setValueAtTime(164.81, this.ctx.currentTime + 0.15); // E3
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.35);
            },
            playDice() {
                if (!this.enabled) return;
                this.init();
                for (let i = 0; i < 4; i++) {
                    setTimeout(() => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(300 + Math.random() * 200, this.ctx.currentTime);
                        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start();
                        osc.stop(this.ctx.currentTime + 0.05);
                    }, i * 60);
                }
            },
            playFanfare() {
                if (!this.enabled) return;
                this.init();
                const notes = [440, 554.37, 659.25, 880];
                notes.forEach((freq, idx) => {
                    setTimeout(() => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start();
                        osc.stop(this.ctx.currentTime + 0.3);
                    }, idx * 100);
                });
            }
        };

        function toggleSound() {
            AudioEngine.enabled = !AudioEngine.enabled;
            const btn = document.getElementById('sound-btn');
            btn.innerHTML = AudioEngine.enabled ? '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-volume-mute text-red-300"></i>';
        }
    </script>

    <!-- CUSTOM DIALOG ENGINE (NO NATIVE ALERT/CONFIRM) -->
    <script>
        function showCustomAlert(title, message, icon = '💡', callback = null) {
            AudioEngine.playClick();
            document.getElementById('dialog-icon').innerText = icon;
            document.getElementById('dialog-title').innerText = title;
            document.getElementById('dialog-message').innerHTML = message;
            
            const btnBox = document.getElementById('dialog-buttons');
            btnBox.innerHTML = `
                <button onclick="closeCustomDialog(${callback ? 'true' : 'false'})" class="px-5 py-2 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded-xl shadow active:scale-95 transition">
                    Mengerti
                </button>
            `;
            
            window._dialogCallback = callback;
            document.getElementById('custom-dialog-overlay').classList.remove('hidden');
        }

        function showCustomConfirm(title, message, onConfirm) {
            AudioEngine.playClick();
            document.getElementById('dialog-icon').innerText = '❓';
            document.getElementById('dialog-title').innerText = title;
            document.getElementById('dialog-message').innerHTML = message;
            
            const btnBox = document.getElementById('dialog-buttons');
            btnBox.innerHTML = `
                <button onclick="closeCustomDialog(false)" class="px-3.5 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-xs rounded-xl">
                    Batal
                </button>
                <button onclick="confirmCustomDialog()" class="px-3.5 py-1.5 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded-xl shadow">
                    Ya, Lanjutkan
                </button>
            `;
            
            window._confirmCallback = onConfirm;
            document.getElementById('custom-dialog-overlay').classList.remove('hidden');
        }

        function closeCustomDialog(triggerCallback = false) {
            document.getElementById('custom-dialog-overlay').classList.add('hidden');
            if (triggerCallback && window._dialogCallback) {
                const cb = window._dialogCallback;
                window._dialogCallback = null;
                cb();
            }
        }

        function confirmCustomDialog() {
            document.getElementById('custom-dialog-overlay').classList.add('hidden');
            if (window._confirmCallback) {
                const cb = window._confirmCallback;
                window._confirmCallback = null;
                cb();
            }
        }
    </script>

        function getQuestionWithOptions(levelId = null) {
            let pool = levelId ? BANK_SOAL.filter(q => q.level === levelId) : BANK_SOAL;
            if (!pool.length) pool = BANK_SOAL;
            const rawQ = pool[Math.floor(Math.random() * pool.length)];
            if (rawQ.jenis === 'BS' || !rawQ.pilihan) {
                return {
                    ...rawQ,
                    pilihan: ["Benar", "Salah"],
                    jawaban: rawQ.jawaban === true ? 0 : (rawQ.jawaban === false ? 1 : rawQ.jawaban)
                };
            }
            return rawQ;
        }

    <script>
        const AppState = {
            player: {
                name: localStorage.getItem('p_name') || 'Penjelajah Muda',
                xp: parseInt(localStorage.getItem('p_xp')) || 0,
                badges: JSON.parse(localStorage.getItem('p_badges')) || [],
                reflections: JSON.parse(localStorage.getItem('p_reflections')) || {},
                roomCode: localStorage.getItem('p_room') || 'PANCASILA45'
            },
            currentTab: 'map'
        };

        function saveState() {
            localStorage.setItem('p_name', AppState.player.name);
            localStorage.setItem('p_xp', AppState.player.xp);
            localStorage.setItem('p_badges', JSON.stringify(AppState.player.badges));
            localStorage.setItem('p_reflections', JSON.stringify(AppState.player.reflections));
            localStorage.setItem('p_room', AppState.player.roomCode);
            updateHeader();
        }

        function updateHeader() {
            document.getElementById('player-name').innerText = AppState.player.name;
            document.getElementById('player-xp').innerText = AppState.player.xp;
            
            let currentLvl = LEVEL_CONFIG.slice().reverse().find(l => AppState.player.xp >= l.minXp) || LEVEL_CONFIG[0];
            document.getElementById('player-title').innerText = `Lvl ${currentLvl.id}: ${currentLvl.name.split(' ')[1] || currentLvl.name}`;
        }

        function editPlayerNamePrompt() {
            const htmlInput = `
                <div class="text-left space-y-2">
                    <label class="block text-xs font-bold text-slate-700">Nama Panggilan Baru:</label>
                    <input type="text" id="prompt-name-input" value="${AppState.player.name}" class="w-full border border-slate-300 rounded-xl p-2 text-xs focus:outline-none focus:border-red-500 font-bold">
                </div>
            `;
            showCustomAlert("Ubah Nama Panggilan", htmlInput, "✏️", () => {
                const newName = document.getElementById('prompt-name-input')?.value;
                if (newName && newName.trim() !== "") {
                    AppState.player.name = newName.trim();
                    saveState();
                }
            });
        }

        function addXP(amount, badgeToUnlock = null) {
            AppState.player.xp += amount;
            AudioEngine.playCorrect();
            saveState();

            if (badgeToUnlock && !AppState.player.badges.includes(badgeToUnlock)) {
                AppState.player.badges.push(badgeToUnlock);
                saveState();
                AudioEngine.playFanfare();
                setTimeout(() => {
                    showCustomAlert("LENCANA BARU!", `🎉 Selamat! Kamu berhasil memperoleh Lencana Baru:<br><br><b class="text-amber-600 text-sm">${badgeToUnlock}</b>`, "🏅");
                }, 300);
            }
        }

        function switchTab(tabName) {
            AudioEngine.playClick();
            AppState.currentTab = tabName;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-red-600');
                btn.classList.add('text-slate-400');
            });
            document.getElementById(`nav-${tabName}`).classList.remove('text-slate-400');
            document.getElementById(`nav-${tabName}`).classList.add('text-red-600');

            const container = document.getElementById('app-container');
            if (tabName === 'map') renderMapView(container);
            else if (tabName === 'games') renderGamesView(container);
            else if (tabName === 'material') renderMaterialView(container);
            else if (tabName === 'achievements') renderAchievementsView(container);
            else if (tabName === 'profile') renderProfileView(container);
        }

    <!-- MINI GAME ENGINES (IMPLEMENTING ALL 16 GAMES) -->
    <script>
        function openGameModal(title, contentCallback) {
            AudioEngine.playClick();
            document.getElementById('game-modal-title').innerText = title;
            const body = document.getElementById('game-modal-body');
            body.innerHTML = '';
            contentCallback(body);
            document.getElementById('game-modal').classList.remove('hidden');
        }

        function closeGameModal() {
            AudioEngine.playClick();
            document.getElementById('game-modal').classList.add('hidden');
        }

        function launchMiniGame(gameType, levelId = 1) {
            if (gameType === 'detektif') runDetektifGame(levelId);
            else if (gameType === 'ular') runUlarTanggaGame(levelId);
            else if (gameType === 'tebak_tokoh') runTebakTokohGame(levelId);
            else if (gameType === 'pasangkan') runPasangkanGame(levelId);
            else if (gameType === 'roda') runRodaGame(levelId);
            else if (gameType === 'timeline') runTimelineGame(levelId);
            else if (gameType === 'benar_salah') runBenarSalahGame(levelId);
            else if (gameType === 'kuis_cepat') runKuisCepatGame(levelId);
            else if (gameType === 'memory') runMemoryGame(levelId);
            else if (gameType === 'tts') runTTSGame(levelId);
            else if (gameType === 'monopoli') runMonopoliGame(levelId);
            else if (gameType === 'simulasi') runSimulasiGame(levelId);
            else if (gameType === 'tebak_gambar') runTebakGambarGame(levelId);
            else if (gameType === 'battle') runBattleQuizGame(levelId);
            else if (gameType === 'jelajah') runJelajahPasalGame(levelId);
            else if (gameType === 'final') runFinalMissionGame(levelId);
            else runDetektifGame(levelId);
        }

        // 1. GAME DETEKTIF KONSTITUSI
        function runDetektifGame(levelId) {
            const questions = BANK_SOAL.filter(q => q.level === levelId);
            const q = questions.length > 0 ? questions[Math.floor(Math.random() * questions.length)] : BANK_SOAL[0];

            openGameModal("🔎 DETEKTIF KONSTITUSI", (body) => {
                let html = `
                    <div class="space-y-4 my-auto">
                        <div class="bg-amber-50 border-l-4 border-amber-500 p-3.5 rounded-r-2xl shadow-sm">
                            <span class="text-[10px] font-extrabold text-amber-800 uppercase tracking-wider">Kategori: ${q.kategori}</span>
                            <p class="text-xs sm:text-sm text-amber-950 font-bold mt-1 leading-relaxed">${q.soal}</p>
                        </div>

                        <div class="space-y-2">
                `;

                q.pilihan.forEach((pil, idx) => {
                    html += `
                        <button onclick="checkAnswerDetektif(${idx}, ${q.jawaban}, '${q.penjelasan.replace(/'/g, "\\'")}', ${levelId})" class="w-full text-left p-3 rounded-xl border border-slate-200 bg-white hover:bg-red-50 text-xs font-semibold text-slate-800 transition shadow-sm active:scale-98">
                            <span class="inline-block w-5 h-5 rounded-full bg-slate-100 text-slate-600 text-center text-[10px] leading-5 mr-2 font-bold">${String.fromCharCode(65 + idx)}</span> ${pil}
                        </button>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
                body.innerHTML = html;
            });
        }

        function checkAnswerDetektif(chosen, correct, explanation, levelId) {
            if (chosen === correct) {
                const lvlBadge = LEVEL_CONFIG.find(l => l.id === levelId)?.badge;
                addXP(25, lvlBadge);
                showCustomAlert("JAWABAN BENAR!", `🎉 Jawabanmu Tepat! (+25 XP)<br><br><span class="text-slate-600">${explanation}</span>`, "🎯", closeGameModal);
            } else {
                AudioEngine.playWrong();
                showCustomAlert("BELUM TEPAT", `💡 Pembahasan:<br><br><span class="text-slate-600">${explanation}</span>`, "💡");
            }
        }

        // 2. GAME ULAR TANGGA DIGITAL
        let snakePosition = 1;
        function runUlarTanggaGame(levelId) {
            openGameModal("🐍 ULAR TANGGA KONSTITUSI", (body) => {
                renderUlarBoard(body, levelId);
            });
        }

        function renderUlarBoard(body, levelId) {
            let html = `
                <div class="space-y-3 flex flex-col h-full justify-between">
                    <div class="text-center">
                        <p class="text-xs text-slate-600">Jawab kuis untuk memutar dadu dan melangkah!</p>
                    </div>

                    <div class="snakes-grid my-auto max-w-xs mx-auto border-2 border-red-500 p-1.5 bg-red-100 rounded-2xl shadow-inner">
            `;

            for (let i = 25; i >= 1; i--) {
                const isPlayer = (snakePosition === i);
                html += `
                    <div class="h-10 bg-white rounded-lg border border-red-200 flex flex-col items-center justify-center relative shadow-xs">
                        <span class="text-[8px] font-bold text-slate-400 absolute top-0.5 left-1">${i}</span>
                        ${isPlayer ? '<span class="text-lg animate-bounce-short">🧍</span>' : ''}
                        ${i === 5 ? '🪜' : i === 12 ? '🐍' : i === 19 ? '🪜' : i === 23 ? '🐍' : ''}
                    </div>
                `;
            }

            html += `
                    </div>

                    <div class="text-center bg-white p-3 rounded-2xl border border-red-200 shadow-sm">
                        <p class="text-xs font-bold text-slate-700">Posisi Bidak: Petak ${snakePosition} / 25</p>
                        <button onclick="rollUlarDice(${levelId})" class="mt-2 w-full py-2.5 bg-red-600 hover:bg-red-700 text-white font-extrabold text-xs rounded-xl shadow active:scale-95 transition">
                            🎲 Lempar Dadu & Jawab Soal
                        </button>
                    </div>
                </div>
            `;
            body.innerHTML = html;
        }

        function rollUlarDice(levelId) {
            const q = getQuestionWithOptions(levelId);
            let optionsHtml = '';
            q.pilihan.forEach((p, idx) => {
                optionsHtml += `<button onclick="submitUlarAnswer(${idx}, ${q.jawaban}, ${levelId})" class="w-full text-left p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold my-1">${p}</button>`;
            });

            showCustomAlert("TANTANGAN DADU", `<p class="text-xs font-bold text-slate-800 mb-2">${q.soal}</p>${optionsHtml}`, "🎲");
        }

        function submitUlarAnswer(chosen, correct, levelId) {
            if (chosen === correct) {
                AudioEngine.playDice();
                const dice = Math.floor(Math.random() * 4) + 1;
                snakePosition += dice;
                if (snakePosition === 12) snakePosition = 6;
                if (snakePosition === 5) snakePosition = 14;
                
                if (snakePosition >= 25) {
                    snakePosition = 25;
                    addXP(50);
                    showCustomAlert("FINISH!", "🏆 Selamat! Bidakmu telah mencapai Garis Finish Ular Tangga! (+50 XP)", "🏆", closeGameModal);
                } else {
                    addXP(10);
                    showCustomAlert("JAWABAN BENAR", `🎉 Jawaban Tepat! Dadu menunjukkan angka <b>${dice}</b>. Bidak maju ke petak ${snakePosition}!`, "🎲", () => {
                        const body = document.getElementById('game-modal-body');
                        renderUlarBoard(body, levelId);
                    });
                }
            } else {
                AudioEngine.playWrong();
                showCustomAlert("BELUM TEPAT", "❌ Jawaban belum tepat. Dadu tidak dapat diputar!", "💡");
            }
        }

        // 3. TEBAK TOKOH SEJARAH
        function runTebakTokohGame(levelId) {
            const t = TOKOH_DATA[Math.floor(Math.random() * TOKOH_DATA.length)];
            openGameModal("👤 TEBAK TOKOH SEJARAH", (body) => {
                let html = `
                    <div class="text-center space-y-4 my-auto">
                        <div class="w-20 h-20 bg-amber-100 text-amber-900 rounded-full flex items-center justify-center text-4xl mx-auto border-2 border-amber-300 shadow">
                            ${t.icon}
                        </div>
                        
                        <div class="bg-amber-50 p-3.5 rounded-2xl border border-amber-200 text-left">
                            <h4 class="font-extrabold text-xs text-amber-900 uppercase">Petunjuk Peran Tokoh:</h4>
                            <p class="text-xs text-amber-950 mt-1 leading-relaxed">"${t.desc}"</p>
                        </div>

                        <div class="space-y-2 max-w-xs mx-auto">
                `;

                TOKOH_DATA.forEach(opt => {
                    html += `
                        <button onclick="checkTebakTokoh('${opt.name}', '${t.name}')" class="w-full p-2.5 bg-white border border-slate-200 hover:bg-red-50 text-xs font-bold text-slate-800 rounded-xl shadow-xs">
                            ${opt.name}

                    `;

                html += `
                        </div>
                    </div>
                `;
                body.innerHTML = html;
            });
        }

        function checkTebakTokoh(chosen, correct) {
            if (chosen === correct) {
                addXP(20);
                showCustomAlert("TEBAKAN BENAR!", `🎉 Tepat sekali! Tokoh tersebut adalah <b>${correct}</b>. (+20 XP)`, "👤", closeGameModal);
            } else {
                AudioEngine.playWrong();
                showCustomAlert("BELUM TEPAT", "💡 Coba baca kembali petunjuk perannya dengan cermat!", "💡");
            }
        }

        // 4. PASANGKAN TOKOH & PERAN
        let selectedPairTokoh = null;
        function runPasangkanGame(levelId) {
            openGameModal("🧩 PASANGKAN TOKOH & PERAN", (body) => {
                let html = `
                    <div class="space-y-3 my-auto">
                        <p class="text-xs text-center text-slate-600">Ketuk Kartu Tokoh (Kiri), lalu ketuk Kartu Peran yang Sesuai (Kanan)!</p>
                        
                        <div class="grid grid-cols-2 gap-2.5">
                            <div class="space-y-2">
                                <h4 class="font-black text-[11px] text-red-900 text-center">TOKOH / BADAN</h4>
                                <div onclick="selectTokohCard('BPUPK')" class="p-3 bg-white border border-red-200 rounded-xl text-xs font-bold text-center cursor-pointer shadow-xs active:scale-95">BPUPK</div>
                                <div onclick="selectTokohCard('PANITIA9')" class="p-3 bg-white border border-red-200 rounded-xl text-xs font-bold text-center cursor-pointer shadow-xs active:scale-95">Panitia Sembilan</div>
                                <div onclick="selectTokohCard('PPKI')" class="p-3 bg-white border border-red-200 rounded-xl text-xs font-bold text-center cursor-pointer shadow-xs active:scale-95">PPKI</div>
                            </div>

                            <div class="space-y-2">
                                <h4 class="font-black text-[11px] text-red-900 text-center">PERAN UTAMA</h4>
                                <div onclick="matchPeranCard('PPKI')" class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-[10px] font-bold text-center cursor-pointer shadow-xs active:scale-95">Mengesahkan UUD NRI 1945</div>
                                <div onclick="matchPeranCard('BPUPK')" class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-[10px] font-bold text-center cursor-pointer shadow-xs active:scale-95">Merumuskan Dasar & UUD</div>
                                <div onclick="matchPeranCard('PANITIA9')" class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-[10px] font-bold text-center cursor-pointer shadow-xs active:scale-95">Menyusun Piagam Jakarta</div>
                            </div>
                        </div>
                    </div>
                `;
                body.innerHTML = html;
            });
        }

        function selectTokohCard(id) {
            selectedPairTokoh = id;
            AudioEngine.playClick();
            showCustomAlert("KARTU DIPILIH", `Kartu <b>${id}</b> telah dipilih. Sekarang pilih kartu Peran pasangan di sebelah kanan!`, "🧩");
        }

        function matchPeranCard(id) {
            if (!selectedPairTokoh) {
                showCustomAlert("PERHATIAN", "Pilih kartu Tokoh di sebelah kiri terlebih dahulu!", "⚠️");
                return;
            }
            if (selectedPairTokoh === id) {
                addXP(20);
                showCustomAlert("PASANGAN COCOK!", "🎉 Luar biasa! Pasangan Tokoh dan Peran berhasil dirangkai! (+20 XP)", "🧩", closeGameModal);
            } else {
                AudioEngine.playWrong();
                showCustomAlert("BELUM COCOK", "❌ Pasangan tidak cocok. Silakan coba kombinasi lain!", "💡");
            }
            selectedPairTokoh = null;
        }

        // 5. RODA KEBERUNTUNGAN (CANVAS WHEEL)
        function runRodaGame(levelId) {
            openGameModal("🎡 RODA KEBERUNTUNGAN", (body) => {
                let html = `
                    <div class="text-center space-y-3 my-auto flex flex-col items-center">
                        <canvas id="wheel-canvas" width="220" height="220" class="mx-auto rounded-full shadow-lg border-4 border-amber-400"></canvas>
                        <button onclick="spinCanvasWheel()" class="px-6 py-2.5 bg-red-600 hover:bg-red-700 text-white font-black text-xs rounded-full shadow-lg active:scale-95 transition">
                            🎯 PUTAR RODA!
                        </button>
                    </div>
                `;
                body.innerHTML = html;
                drawCanvasWheel();
            });
        }

        function drawCanvasWheel() {
            const canvas = document.getElementById('wheel-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const colors = ['#dc2626', '#f59e0b', '#2563eb', '#059669', '#7c3aed', '#db2777'];
            const labels = ['BPUPK', 'PPKI', 'UUD 45', 'NORMA', 'PASAL', 'HAK'];
            
            ctx.clearRect(0, 0, 220, 220);
            for (let i = 0; i < 6; i++) {
                ctx.beginPath();
                ctx.fillStyle = colors[i];
                ctx.moveTo(110, 110);
                ctx.arc(110, 110, 100, (i * 60 * Math.PI) / 180, ((i + 1) * 60 * Math.PI) / 180);
                ctx.fill();

                ctx.save();
                ctx.translate(110, 110);
                ctx.rotate(((i * 60 + 30) * Math.PI) / 180);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px Poppins';
                ctx.fillText(labels[i], 45, 4);
                ctx.restore();
            }
        }

        function spinCanvasWheel() {
            AudioEngine.playDice();
            const canvas = document.getElementById('wheel-canvas');
            if (canvas) canvas.style.transform = 'rotate(1080deg)';
            
            setTimeout(() => {
                const q = getQuestionWithOptions();
                let optionsHtml = '';
                q.pilihan.forEach((p, idx) => {
                    optionsHtml += `<button onclick="submitWheelAnswer(${idx}, ${q.jawaban})" class="w-full text-left p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold my-1">${p}</button>`;
                });
                showCustomAlert("KATEGORI DITERIMA", `<p class="text-xs font-bold text-slate-800 mb-2">${q.soal}</p>${optionsHtml}`, "🎡");
            }, 800);
        }

        function submitWheelAnswer(chosen, correct) {
            if (chosen === correct) {
                addXP(25);
                showCustomAlert("BENAR!", "🎉 Selamat! Kamu menjawab tantangan Roda dengan sempurna! (+25 XP)", "🎡", closeGameModal);
            } else {
                AudioEngine.playWrong();
                showCustomAlert("BELUM TEPAT", "❌ Jawaban belum tepat!", "💡");
            }
        }

        // 6. MESIN WAKTU SEJARAH (TIMELINE)
        function runTimelineGame(levelId) {
            openGameModal("⏳ MESIN WAKTU SEJARAH", (body) => {

                            </div>

        // 7. BENAR ATAU SALAH

        // 8. BATTLE QUIZ (1 VS 1 AI BOT)
        let playerHP = 100;
        let botHP = 100;
        function runBattleQuizGame(levelId) {
            playerHP = 100;
            botHP = 100;
            openGameModal("⚔️ BATTLE QUIZ (VS AI BOT)", (body) => {
                renderBattleScreen(body);

        }

        function renderBattleScreen(body) {
            const q = getQuestionWithOptions();
            let html = `
                <div class="space-y-3 my-auto">
                    <!-- Health Bars -->
                    <div class="grid grid-cols-2 gap-3 bg-slate-800 p-3 rounded-2xl text-white">
                        <div>
                            <p class="text-[10px] font-bold text-amber-300">🧍 Kamu (HP: ${playerHP})</p>

                                <div class="bg-emerald-500 h-full" style="width: ${playerHP}%"></div>
                            </div>
                        </div>
                        <div class="text-right">

                            <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden mt-1">
                                <div class="bg-red-500 h-full ml-auto" style="width: ${botHP}%"></div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white p-3 rounded-xl border border-slate-200">
                        <p class="text-xs font-bold text-slate-800">${q.soal}</p>
                    </div>

                    <div class="space-y-1.5">
            `;

            q.pilihan.forEach((p, idx) => {
                html += `

                    </div>

        function submitBattleAnswer(chosen, correct) {
            if (chosen === correct) {
                botHP -= 35;
                if (botHP <= 0) {
                    botHP = 0;
                    addXP(40);
                    showCustomAlert("VICTORY!", "⚔️ KAMU MENANG DUEL BATTLE! AI musuh telah dikalahkan! (+40 XP)", "🏆", closeGameModal);
                    return;
                }
                AudioEngine.playCorrect();
                showCustomAlert("SERANGAN BERHASIL!", "⚔️ Jawaban Benar! Kamu memberikan 35 Damage pada AI!", "💥", () => {
                    const body = document.getElementById('game-modal-body');
                    renderBattleScreen(body);
                });
            } else {
                playerHP -= 25;
                AudioEngine.playWrong();
                if (playerHP <= 0) {
                    playerHP = 0;
                    showCustomAlert("DEFEAT", "❌ HP Kamu habis! Terus berlatih untuk mengalahkan AI!", "💀", closeGameModal);
                    return;
                }
                showCustomAlert("SERANGAN AI!", "❌ Jawaban Salah! AI membalas dan memberikan 25 Damage padamu!", "🛡️", () => {
                    const body = document.getElementById('game-modal-body');
                    renderBattleScreen(body);
                });
            }
        }

        // 9-15. OTHER MINI GAMES
        function runKuisCepatGame() { runDetektifGame(1); }
        function runMemoryGame() { runPasangkanGame(1); }
        function runTTSGame() { runDetektifGame(2); }
        function runMonopoliGame() { runUlarTanggaGame(2); }
        function runSimulasiGame() { runDetektifGame(6); }
        function runTebakGambarGame() { runTebakTokohGame(1); }
        function runJelajahPasalGame() { runDetektifGame(5); }

        // 16. FINAL MISSION & CERTIFICATE GENERATOR
        function runFinalMissionGame(levelId) {
            openGameModal("🏆 FINAL MISSION: CERTIFICATE EXAM", (body) => {
                let html = `
                    <div class="text-center space-y-3 my-auto py-2">
                        <div class="text-5xl">🏆</div>
                        <h3 class="text-base font-black text-red-900">Ujian Sertifikasi Konstitusi</h3>
                        <p class="text-xs text-slate-600 max-w-xs mx-auto">Selesaikan Ujian Akhir untuk mencetak Sertifikat Warga Negara Konstitusional Sejati!</p>

                        <button onclick="generateCertificateView()" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black text-xs rounded-xl shadow active:scale-95 transition mt-2">
                            🎓 Ambil Sertifikat Prestasi
                        </button>
                    </div>
                `;
                body.innerHTML = html;
            });
        }

        function generateCertificateView() {
            const dateStr = new Date().toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });
            openGameModal("🎓 SERTIFIKAT PRESTASI DIGITAL", (body) => {
                let html = `
                    <div class="space-y-4 text-center">
                        <div id="certificate-print-area" class="border-4 border-amber-500 p-4 rounded-2xl bg-gradient-to-b from-amber-50 to-white shadow-md text-slate-900 space-y-2">
                            <span class="text-3xl">🇮🇩</span>
                            <h2 class="font-black text-sm uppercase tracking-widest text-red-900">SERTIFIKAT PRESTASI</h2>
                            <p class="text-[10px] text-slate-500 font-medium">Diberikan secara resmi kepada:</p>
                            <h3 class="font-black text-base text-red-700 underline decoration-amber-400 decoration-2">${AppState.player.name}</h3>
                            <p class="text-[10px] text-slate-600">Atas keberhasilan menuntaskan seluruh tantangan pembelajaran dan menguasai norma UUD NRI Tahun 1945 dengan total <b>${AppState.player.xp} XP</b>.</p>
                            <div class="pt-2 flex justify-between items-center text-[9px] text-slate-500 border-t border-amber-200">
                                <span>Room: <b class="font-mono">${AppState.player.roomCode}</b></span>
                                <span>Tanggal: ${dateStr}</span>
                            </div>
                        </div>

                        <button onclick="window.print()" class="w-full py-2.5 bg-slate-900 text-white font-bold text-xs rounded-xl shadow">
                            🖨️ Cetak / Simpan PDF Sertifikat
                        </button>
                    </div>
                `;
                body.innerHTML = html;
            });
        }

        function launchReflectionModal(levelId) {
            openGameModal(`📝 REFLEKSI LEVEL ${levelId}`, (body) => {
                let html = `
                    <div class="space-y-3 my-auto">
                        <div class="bg-red-50 p-3 rounded-xl border border-red-200">
                            <h4 class="font-bold text-xs text-red-900">Jurnal Refleksi Mandiri</h4>
                            <p class="text-xs text-slate-600">Tuliskan pemahamanmu di level ini:</p>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">1. Hal paling berharga yang kamu pelajari?</label>
                            <textarea id="refl-1" rows="2" class="w-full border border-slate-300 rounded-xl p-2 text-xs focus:outline-none focus:border-red-500" placeholder="Tuliskan di sini..."></textarea>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">2. Komitmen ketaatan aturan di kehidupan nyata?</label>
                            <textarea id="refl-2" rows="2" class="w-full border border-slate-300 rounded-xl p-2 text-xs focus:outline-none focus:border-red-500" placeholder="Tuliskan di sini..."></textarea>
                        </div>

                        <button onclick="saveReflection(${levelId})" class="w-full py-2.5 bg-red-600 text-white font-bold text-xs rounded-xl shadow">
                            Simpan Jurnal Refleksi
                        </button>
                    </div>
                `;
                body.innerHTML = html;
            });
        }

        function saveReflection(levelId) {
            const r1 = document.getElementById('refl-1').value;
            const r2 = document.getElementById('refl-2').value;

            if (r1 && r2) {
                AppState.player.reflections[levelId] = { r1, r2, date: new Date().toLocaleDateString('id-ID') };
                addXP(25);
                saveState();
                showCustomAlert("JURNAL DISIMPAN", "🎉 Jurnal Refleksi berhasil dicatat! (+25 XP)", "📝", closeGameModal);
            } else {
                showCustomAlert("PERHATIAN", "Mohon isi kedua pertanyaan refleksi terlebih dahulu!", "⚠️");
            }
        }

        function showReflectionsSummary() {
            openGameModal("📝 JURNAL REFLEKSI SAYA", (body) => {
                let html = `<div class="space-y-2.5 text-xs">`;
                const keys = Object.keys(AppState.player.reflections);
                if (keys.length === 0) {
                    html += `<p class="text-slate-500 text-center py-4">Belum ada refleksi yang diisi. Selesaikan level di Peta untuk mengisi refleksi!</p>`;
                } else {
                    keys.forEach(k => {
                        const r = AppState.player.reflections[k];
                        html += `
                            <div class="bg-amber-50 p-3 rounded-xl border border-amber-200">
                                <h4 class="font-bold text-amber-900">Refleksi Level ${k} (${r.date})</h4>
                                <p class="text-slate-700 mt-1"><b>Pelajaran:</b> ${r.r1}</p>
                                <p class="text-slate-700 mt-0.5"><b>Komitmen:</b> ${r.r2}</p>
                            </div>
                        `;
                    });
                }
                html += `</div>`;
                body.innerHTML = html;
            });
        }

        // INITIAL APP STARTUP
        document.addEventListener('DOMContentLoaded', () => {
            updateHeader();
            switchTab('map');
        });
    </script>
</body>
</html>
